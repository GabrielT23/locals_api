# —————————————— Dados de Conexão e JPA ——————————————
spring.application.name=locals_api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/locals}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:docker}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# —————————————— Segurança ——————————————
security.token.secret=locals-secret

# —————————————— Formato de log no console ——————————————
# timestamp + thread + nível + logger + mensagem
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Se preferir cores ANSI (útil em terminais compatíveis):
# logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr([%thread]){cyan} %clr(%-5level){yellow} %clr(%logger{36}){magenta} %clr(-){faint} %msg%n

# —————————————— Níveis de log por pacote ——————————————
# Silence logs muito verbosos de frameworks
logging.level.org.hibernate=warn
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql=warn
logging.level.org.springframework.web=info
logging.level.org.apache.catalina=warn

# Opcional: detalhe seus próprios pacotes em DEBUG ou INFO
logging.level.com.locals=info


